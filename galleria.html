  <main class="container" id="sisalto" tabindex="-1">
    <p class="eyebrow">Kuvagalleria</p>
    <h1>Galleria</h1>
    <p class="lead">Ottamiani valokuvia</p>

    <!-- Lisää uusia kuvia kopioimalla yksi figure-elementti. -->
    <div class="gallery">
      <figure>
        <img src="assets/jarvi.svg" width="320" height="240" alt="Kuva järvestä, vihreistä kukkuloista ja kirkkaasta keltaisesta auringosta.">
        <figcaption><h2>Järvimaisema</h2><p>Vihreät kuvitettuja kukkuloita ja rauhallinen joki.</p></figcaption>
      </figure>
      <figure>
        <img src="assets/kasvi.svg" width="320" height="240" alt="Kuvitus vihreästä huonekasvista saviruukussa.">
        <figcaption><h2>Huonekasvi</h2><p>Vihreä kasvi saviruukussa.</p></figcaption>
      </figure>
      <figure>
        <img src="assets/talo.svg" width="320" height="240" alt="Kuvitus pienestä talosta puun vieressä.">
        <figcaption><h2>Talo ja puu</h2><p>Pieni talo ja puu sen vieressä.</p></figcaption>
      </figure>
    </div>
    <p class="note">Vinkki: kerro jokaisesta omasta kuvasta myös lyhyt tarina kuvatekstissä.</p>
  </main>
